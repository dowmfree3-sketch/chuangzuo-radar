<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>创作雷达 · AI 创作智能体</title>
<style>
:root{
  --label:#251A1B; --label2:rgba(37,26,27,.56); --label3:rgba(37,26,27,.32);
  --glass:rgba(255,255,255,.4); --glass-strong:rgba(255,255,255,.62);
  --stroke:rgba(255,255,255,.8);
  --accent:#B43141; --accent-2:#D15563;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sf);color:var(--label);background:#c4a3a6;display:flex;justify-content:center;min-height:100vh;padding:6px 0}
.app{width:min(1100px,99.5vw);height:calc(100vh - 12px);display:flex;flex-direction:column;background:#EADCDC;border-radius:14px;box-shadow:0 30px 70px rgba(70,25,30,.26);overflow:hidden}
.header{padding:16px 22px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;gap:12px;flex-shrink:0}
.header .dot{width:11px;height:11px;border-radius:50%;background:#7CFFB2;box-shadow:0 0 10px #7CFFB2}
.header h1{font-size:21px;font-weight:700;letter-spacing:.3px}
.header p{font-size:13px;opacity:.85;margin-top:2px}
.header .badge{margin-left:auto;font-size:12px;background:rgba(255,255,255,.2);padding:5px 11px;border-radius:999px}
.chat{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:13px 16px;border-radius:16px;font-size:16px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-bottom-right-radius:4px}
.msg.agent{align-self:flex-start;background:var(--glass-strong);border:1px solid var(--stroke);border-bottom-left-radius:4px;backdrop-filter:blur(10px)}
/* 工具调用卡片 */
.tool{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.5);border:1px dashed rgba(180,49,65,.35);border-radius:14px;padding:11px 14px;font-size:14px;align-self:flex-start;max-width:88%}
.tool .ic{font-size:18px;flex-shrink:0}
.tool .name{font-weight:700;color:var(--accent)}
.tool .args{color:var(--label2);font-size:13px;margin-top:2px}
.tool.run{opacity:.7}
.tool.ok{border-style:solid;border-color:rgba(46,125,107,.4);background:rgba(232,246,240,.6)}
.tool.err{border-color:rgba(180,49,65,.5);background:rgba(253,232,232,.7)}
/* 结构化产物 */
.artifact{align-self:flex-start;max-width:92%;width:100%;margin-top:2px}
.card{background:var(--glass-strong);border:1px solid var(--stroke);border-radius:16px;padding:16px;box-shadow:0 8px 22px rgba(90,30,40,.1)}
.card h3{font-size:17px;margin-bottom:10px;color:var(--accent)}
.vid{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.55);margin-bottom:8px;border:1px solid var(--stroke)}
.vid img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#eee}
.vid .t{font-weight:600;font-size:15px}
.vid .a{font-size:13px;color:var(--label2)}
.vid a{color:var(--accent);font-size:13px;text-decoration:none}
.kv{margin:7px 0;font-size:15px;line-height:1.6}
.kv b{color:var(--accent)}
.scene{border-left:4px solid var(--accent-2);padding:8px 12px;margin:8px 0;background:rgba(255,255,255,.5);border-radius:0 10px 10px 0;font-size:14px;line-height:1.55}
.scene .st{font-weight:700;color:var(--label)}
.scene .tm{font-size:12px;color:var(--label3);margin-left:6px}
.typing{display:flex;gap:5px;align-self:flex-start;padding:12px 16px;background:var(--glass-strong);border-radius:16px;border-bottom-left-radius:4px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--accent-2);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.inputbar{flex-shrink:0;display:flex;gap:10px;padding:14px 18px;background:rgba(255,255,255,.5);border-top:1px solid var(--stroke)}
.inputbar input{flex:1;font-size:16px;padding:13px 16px;border-radius:14px;border:1px solid var(--stroke);background:#fff;outline:none}
.inputbar button{font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;border-radius:14px;padding:0 22px;cursor:pointer}
.inputbar button:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--accent);font-size:14px;align-self:flex-start;background:rgba(253,232,232,.8);padding:10px 14px;border-radius:12px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="dot"></span>
    <div><h1>创作雷达 · AI 创作智能体</h1><p>说一个创作想法，我来自主搜视频、拆解、出脚本</p></div>
    <span class="badge" id="statusBadge">连接中…</span>
  </div>
  <div class="chat" id="chat"></div>
  <div class="inputbar">
    <input id="msgInput" placeholder="例如：帮我做一个关于『大学生实习』的短视频" autocomplete="off" />
    <button id="sendBtn">发送</button>
  </div>
</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const chat = $("#chat");
let messages = []; // 多轮上下文（发给后端 Agent）
let busy = false;

async function api(path, data) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

function addUser(text){
  const m = document.createElement("div"); m.className="msg user"; m.textContent=text; chat.appendChild(m); scrollDown();
}
function addAgent(text){
  const m = document.createElement("div"); m.className="msg agent"; m.textContent=text; chat.appendChild(m); scrollDown(); return m;
}
function addTyping(){
  const t = document.createElement("div"); t.className="typing"; t.innerHTML="<i></i><i></i><i></i>"; chat.appendChild(t); scrollDown(); return t;
}
function addError(text){
  const m = document.createElement("div"); m.className="err"; m.textContent=text; chat.appendChild(m); scrollDown();
}

function toolCard(name, args, state){
  const labels = { search_bilibili:"🔍 搜索 B站视频", analyze_video:"🧩 拆解视频", generate_script:"🎬 生成脚本" };
  const c = document.createElement("div");
  c.className = "tool " + (state||"");
  const argStr = args ? JSON.stringify(args, null, 0).replace(/[{}"]/g,"") : "";
  c.innerHTML = `<div class="ic">${state==="ok"?"✅":state==="err"?"⚠️":"⚙️"}</div><div><div class="name">${labels[name]||name}</div><div class="args">${argStr}</div></div>`;
  chat.appendChild(c); scrollDown(); return c;
}

function renderVideos(artifact){
  const box = document.createElement("div"); box.className="artifact";
  const card = document.createElement("div"); card.className="card";
  card.appendChild(Object.assign(document.createElement("h3"),{textContent:"📺 搜到的相关视频"}));
  (artifact.videos||[]).forEach(v=>{
    const d = document.createElement("div"); d.className="vid";
    const img = v.cover ? `<img src="${v.cover}" alt="">` : `<img alt="" style="display:flex;align-items:center;justify-content:center;color:#B43141;font-size:22px">▶</img>`;
    d.innerHTML = `${img}<div style="flex:1;min-width:0"><div class="t">${(v.title||"").replace(/</g,"&lt;")}</div><div class="a">${(v.author||"")}</div>${v.url?`<a href="${v.url}" target="_blank" rel="noopener">查看原视频 ↗</a>`:""}</div>`;
    card.appendChild(d);
  });
  box.appendChild(card); chat.appendChild(box); scrollDown();
}

function renderAnalysis(artifact){
  const a = artifact.analysis||{}; const v = artifact.video||{};
  const box = document.createElement("div"); box.className="artifact";
  const card = document.createElement("div"); card.className="card";
  card.appendChild(Object.assign(document.createElement("h3"),{textContent:"🧩 视频拆解：" +(v.title||"")}));
  const rows = [["一句话定位",a.positioning],["开头钩子",a.hook],["内容结构",Array.isArray(a.structure)?a.structure.join(" / "):a.structure],["可借鉴爆点",Array.isArray(a.borrowable)?a.borrowable.join(" / "):a.borrowable],["受众洞察",a.audience_insight],["复刻切入点",a.your_angle],["注意事项",a.caveats]];
  rows.forEach(([k,val])=>{ if(val){ const d=document.createElement("div"); d.className="kv"; d.innerHTML=`<b>${k}：</b>${String(val).replace(/</g,"&lt;")}`; card.appendChild(d);} });
  box.appendChild(card); chat.appendChild(box); scrollDown();
}

function renderScript(artifact){
  const cs = artifact.content_strategy||{}; const sc = artifact.script||{};
  const box = document.createElement("div"); box.className="artifact";
  const card = document.createElement("div"); card.className="card";
  card.appendChild(Object.assign(document.createElement("h3"),{textContent:"🎬 内容策略与脚本："+(sc.title||"")}));
  [["定位",cs.positioning],["核心信息",cs.key_message],["目标受众",cs.target_audience],["调性",cs.tone],["形式",cs.format]].forEach(([k,val])=>{ if(val){const d=document.createElement("div");d.className="kv";d.innerHTML=`<b>${k}：</b>${String(val).replace(/</g,"&lt;")}`;card.appendChild(d);} });
  if(Array.isArray(cs.posting_suggestions)&&cs.posting_suggestions.length){const d=document.createElement("div");d.className="kv";d.innerHTML=`<b>发布建议：</b>${cs.posting_suggestions.join(" / ")}`;card.appendChild(d);}
  (sc.scenes||[]).forEach(s=>{
    const d=document.createElement("div"); d.className="scene";
    d.innerHTML=`<div class="st">${s.stage||""}<span class="tm">${s.time||""}</span></div><div>🗣 ${s.oral||""}</div><div>🎥 ${s.shot||""} ｜ ✂️ ${s.move||""}</div>`;
    card.appendChild(d);
  });
  box.appendChild(card); chat.appendChild(box); scrollDown();
}

async function send(){
  const input = $("#msgInput");
  const text = input.value.trim();
  if(!text || busy) return;
  input.value="";
  addUser(text);
  messages.push({ role:"user", content:text });
  busy=true; $("#sendBtn").disabled=true;
  const typing = addTyping();
  try{
    const data = await api("/api/agent-chat", { messages, accountContext:{account:""} });
    typing.remove();
    const events = data.events||[];
    for(const ev of events){
      if(ev.type==="thought"){ addAgent(ev.text); }
      else if(ev.type==="tool"){
        // 先放一个 running 卡片，稍后由 tool_result 替换/补充
        ev._card = toolCard(ev.name, ev.args, "run");
      }
      else if(ev.type==="tool_result"){
        // 找到对应 tool 卡片更新状态
        const cards = chat.querySelectorAll(".tool.run");
        // 简单策略：更新最后一张 run 卡片
        const last = [...cards].pop();
        if(last){ last.className = "tool " + (ev.result&&ev.result.error?"err":"ok"); }
        if(ev.artifact){
          if(ev.artifact.type==="videos") renderVideos(ev.artifact);
          else if(ev.artifact.type==="analysis") renderAnalysis(ev.artifact);
          else if(ev.artifact.type==="script") renderScript(ev.artifact);
        } else if(ev.result&&ev.result.error){
          addError(ev.result.error);
        }
      }
      else if(ev.type==="error"){ addError(ev.text); }
    }
    // 同步最新上下文（后端已含 tool 结果，但前端以自己维护的为准更稳）
    // 这里直接用后端返回的 events 已足够展示，不再追加 messages 内部细节
  }catch(e){
    typing.remove();
    addError("请求失败：" + e.message + "（请确认后端已启动且配置了 OPENROUTER_API_KEY）");
  }finally{
    busy=false; $("#sendBtn").disabled=false; input.focus();
  }
}

$("#sendBtn").addEventListener("click", send);
$("#msgInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") send(); });

// 检测后端 AI 状态
(async()=>{
  try{
    const s = await api("/api/ai_status", {});
    $("#statusBadge").textContent = s.online ? ("AI 在线 · "+s.model) : "AI 未配置";
  }catch(e){ $("#statusBadge").textContent="后端未连接"; }
  addAgent("你好，我是创作雷达智能体 🤖\n告诉我一个创作想法（比如「大学生实习 vlog」「游戏测评」），我会自己去 B站搜相关视频、挑一条拆解爆点，再帮你产出可执行的短视频脚本。");
})();
</script>
</body>
</html>
